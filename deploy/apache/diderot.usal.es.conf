# Apache 2.4 como proxy inverso con HTTPS delante de la app (127.0.0.1:3000).
#
# Módulos:  a2enmod proxy proxy_http ssl headers rewrite http2
# Instalar: cp deploy/apache/diderot.usal.es.conf /etc/apache2/sites-available/
#           a2ensite diderot.usal.es && apachectl configtest && systemctl reload apache2
# Certificado (Let's Encrypt): certbot certonly --apache -d diderot.usal.es
#   (o el certificado institucional de la USAL: ajustar las dos rutas SSL).

<VirtualHost *:80>
    ServerName diderot.usal.es

    # Todo a HTTPS salvo el reto de Let's Encrypt.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName diderot.usal.es
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/diderot.usal.es/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/diderot.usal.es/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off

    # HSTS: solo HTTPS durante un año (la app añade el resto de cabeceras).
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always unset X-Powered-By
    ServerSignature Off

    # La web anterior era un WordPress atacado: los bots seguirán probando
    # sus rutas. Se responden aquí mismo (410 Gone) sin llegar a la app.
    RedirectMatch 410 ^/(wp-admin|wp-login\.php|wp-content|wp-includes|wp-json|xmlrpc\.php|wp-config)

    # Proxy inverso a la app (Docker, solo escucha en localhost)
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass        / http://127.0.0.1:3000/ timeout=60 retry=0
    ProxyPassReverse / http://127.0.0.1:3000/

    # Subidas del panel: hasta 25 MB (+ margen del multipart)
    LimitRequestBody 27262976

    ErrorLog  ${APACHE_LOG_DIR}/diderot_error.log
    CustomLog ${APACHE_LOG_DIR}/diderot_access.log combined
</VirtualHost>
</IfModule>
