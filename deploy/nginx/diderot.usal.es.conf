# nginx como proxy inverso con HTTPS delante de la app (diderot.usal.es).
#
# Certificado institucional (GÉANT/HARICA, lo emite el CPD de la USAL):
#   /etc/ssl/certs/diderot_Cert_bundle.pem   certificado + intermedios
#   /etc/ssl/private/diderot.usal.es.key     clave sin cifrar (600, root); la
#                                            deja lista deploy/bootstrap-vm.sh
#
# Instalación: deploy/bootstrap-vm.sh copia este fichero a
# /etc/nginx/sites-available/, lo activa y recarga nginx. Si se cambia:
#   sudo cp deploy/nginx/diderot.usal.es.conf /etc/nginx/sites-available/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name diderot.usal.es;
    server_tokens off;

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name diderot.usal.es;

    ssl_certificate     /etc/ssl/certs/diderot_Cert_bundle.pem;
    ssl_certificate_key /etc/ssl/private/diderot.usal.es.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Subidas del panel: hasta 25 MB
    client_max_body_size 26m;

    # Rastreos del antiguo WordPress: 410 sin llegar a la app.
    location ~ ^/(wp-admin|wp-login\.php|wp-content|wp-includes|wp-json|xmlrpc\.php|wp-config) {
        return 410;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
