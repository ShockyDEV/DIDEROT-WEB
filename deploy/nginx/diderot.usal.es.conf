# Alternativa a Apache: nginx como proxy inverso con HTTPS delante de la app.
#
# Instalar: cp deploy/nginx/diderot.usal.es.conf /etc/nginx/sites-available/
#           ln -s /etc/nginx/sites-available/diderot.usal.es.conf /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx
# Certificado: certbot certonly --nginx -d diderot.usal.es

server {
    listen 80;
    listen [::]:80;
    server_name diderot.usal.es;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name diderot.usal.es;

    ssl_certificate     /etc/letsencrypt/live/diderot.usal.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diderot.usal.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Subidas del panel: hasta 25 MB
    client_max_body_size 26m;

    # Rastreos del antiguo WordPress: 410 sin llegar a la app.
    location ~ ^/(wp-admin|wp-login\.php|wp-content|wp-includes|wp-json|xmlrpc\.php|wp-config) {
        return 410;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
